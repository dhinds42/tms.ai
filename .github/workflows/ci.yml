name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # TODO(stage-0): switch to `npm ci` once package-lock.json is regenerated
      # with the new test tooling (jest, ts-jest, @types/jest).
      # Note: Base44's bot manages package-lock.json on main; only commit the
      # regenerated lock if the bot has not already done so.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

           # Lint is advisory for now: the repo has ~695 pre-existing ESLint errors
      # (markdown saved as .jsx files, unwired frontend test globals, and some
      # real undefined-variable bugs). Cleanup tracked as Stage 0.5 — flip this
      # back to blocking when the backlog reaches zero.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

           # Typecheck is advisory for now: pre-existing type errors across
      # src/pages (UI primitives missing children/variant types, phantom
      # references like ComprehensiveAutomationEngine in WorkflowAutomation).
      # Cleanup tracked as Stage 0.5 — restore blocking when the backlog is fixed.
      - name: Typecheck (advisory)
        run: npm run typecheck
        continue-on-error: true

      - name: Unit tests (server functions)
        run: npm test

      - name: Build
        run: npm run build
        env:
          CI: true
